name: BU04 STM32 Firmware Source Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bu04-stm32-uwb-positioning
    paths:
      - 'firmware/stm32-bu04-positioning/**'
      - '.github/workflows/bu04-stm32-build.yml'

jobs:
  validate-patched-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve manufacturer SDK
        run: git clone --depth 1 --branch master https://github.com/Ai-Thinker-AIoT/STM32F103-BU0x_SDK.git firmware/stm32-bu04-positioning/vendor-project
      - name: Apply mower telemetry firmware patch
        run: python3 firmware/stm32-bu04-positioning/tools/patch_vendor_sdk.py
      - name: Verify patched firmware source
        shell: bash
        run: |
          set -eu
          root=firmware/stm32-bu04-positioning/vendor-project
          test -s "$root/Projects/USER/Project.uvprojx"
          grep -Fq 'mower_emit_ranges(dis);' "$root/Components/APP/user_out.c"
          grep -Fq 'R,%d,%u' "$root/Components/APP/user_out.c"
          echo "BU04 mower firmware source patch verified. NOT a firmware binary build."
      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: bu04-mower-patched-sdk-source
          path: firmware/stm32-bu04-positioning/vendor-project
          retention-days: 7
