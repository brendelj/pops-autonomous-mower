name: BU04 STM32 SDK Source Verification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bu04-stm32-uwb-positioning
    paths:
      - 'firmware/stm32-bu04-positioning/**'
      - '.github/workflows/bu04-stm32-build.yml'

jobs:
  verify-vendor-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve actual BU04 firmware SDK
        run: |
          git clone --depth 1 --branch master https://github.com/Ai-Thinker-AIoT/STM32F103-BU0x_SDK.git firmware/stm32-bu04-positioning/vendor-project
      - name: Validate project and TWR source files
        run: |
          set -eu
          root=firmware/stm32-bu04-positioning/vendor-project
          test -s "$root/Projects/USER/Project.uvprojx"
          test -s "$root/Components/Examples/examples/ex_05c_ds_twr_init_sts_sdc/ds_twr_sts_sdc_init.c"
          test -s "$root/Components/Examples/examples/ex_05d_ds_twr_resp_sts_sdc/ds_twr_sts_sdc_resp.c"
          echo "Vendor SDK retrieved and source files verified."
      - name: Archive SDK for build conversion
        uses: actions/upload-artifact@v4
        with:
          name: bu04-vendor-sdk-source
          path: firmware/stm32-bu04-positioning/vendor-project
          retention-days: 7
